services:
  real_time_ai:
    image: real_time_ai:latest
    container_name: real_time_ai
    environment:
      DISPLAY: "${DISPLAY}"
      MPLCONFIGDIR: "/tmp"
      IP: "172.16.0.3"
      PORT: "5005"
    devices:
      - "/dev/video0:/dev/video0"
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix"
    user: "${UID}:${GID}"
    group_add:
      - "${VIDEO_GID}"
    stdin_open: true
    tty: true
